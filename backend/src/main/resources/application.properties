server.port=${PORT:8080}
server.shutdown=graceful
spring.lifecycle.timeout-per-shutdown-phase=10s
spring.application.name=smart-campus-backend

# ------------------------------- MySQL / JDBC ---------------------------------------
# Production: set SPRING_DATASOURCE_URL/USERNAME/PASSWORD (Vercel + TiDB Cloud),
# or MYSQLHOST/MYSQLPORT/MYSQLDATABASE/MYSQLUSER/MYSQLPASSWORD (Railway).
# Local dev: uses defaults (localhost, root, root).
spring.datasource.url=jdbc:mysql://${MYSQLHOST:localhost}:${MYSQLPORT:3306}/${MYSQLDATABASE:smart_campus_db}?useSSL=false&allowPublicKeyRetrieval=true&characterEncoding=UTF-8&serverTimezone=Asia/Kolkata
spring.datasource.username=${MYSQLUSER:root}
spring.datasource.password=${MYSQLPASSWORD:root}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.hikari.pool-name=SmartCampusHikari
spring.datasource.hikari.maximum-pool-size=${DB_POOL_SIZE:10}
spring.datasource.hikari.minimum-idle=${DB_MIN_IDLE:2}
spring.datasource.hikari.connection-timeout=10000
spring.datasource.hikari.max-lifetime=240000
spring.datasource.hikari.keepalive-time=60000

# ------------------------------- App settings --------------------------------------
app.export.directory=${APP_EXPORT_DIRECTORY:exports}
app.log.directory=${APP_LOG_DIRECTORY:logs}
# Applies database/academic_migration.sql automatically when an older database
# is missing the academic tables/columns.  The script is additive and idempotent.
app.db.academic-migration-enabled=${APP_DB_ACADEMIC_MIGRATION_ENABLED:true}
app.session.ttl-minutes=720
app.booking.lock-stripes=64

# ------------------------------- Assignment uploads ---------------------------------
# Files are stored OUTSIDE the web root and served only by authenticated endpoints.
# Production must point this at persistent storage (for example a mounted volume).
app.upload.directory=${APP_UPLOAD_DIRECTORY:uploads}
app.upload.allowed-extensions=${APP_UPLOAD_ALLOWED_EXTENSIONS:pdf,doc,docx,ppt,pptx,xls,xlsx,txt,zip,png,jpg,jpeg}
app.upload.max-size-mb=${APP_UPLOAD_MAX_SIZE_MB:20}
spring.servlet.multipart.max-file-size=${SPRING_MULTIPART_MAX_FILE_SIZE:20MB}
spring.servlet.multipart.max-request-size=${SPRING_MULTIPART_MAX_REQUEST_SIZE:25MB}

# ------------------------------- Logging -------------------------------------------
logging.level.com.smartcampus=INFO
logging.level.org.springframework.jdbc=INFO
