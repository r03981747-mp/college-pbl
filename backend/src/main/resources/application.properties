server.port=8080
spring.application.name=smart-campus-backend

# ------------------------------- MySQL / JDBC ---------------------------------------
spring.datasource.url=jdbc:mysql://localhost:3306/smart_campus_db?useSSL=false&allowPublicKeyRetrieval=true&characterEncoding=UTF-8&serverTimezone=Asia/Kolkata
spring.datasource.username=root
spring.datasource.password=root
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.hikari.pool-name=SmartCampusHikari
spring.datasource.hikari.maximum-pool-size=25
spring.datasource.hikari.minimum-idle=5
spring.datasource.hikari.connection-timeout=10000

# ------------------------------- App settings --------------------------------------
app.export.directory=exports
app.log.directory=logs
app.session.ttl-minutes=720
app.booking.lock-stripes=64

# ------------------------------- Logging -------------------------------------------
logging.level.com.smartcampus=INFO
logging.level.org.springframework.jdbc=INFO
