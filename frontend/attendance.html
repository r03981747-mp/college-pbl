<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Attendance · Smart Campus</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link href="css/style.css" rel="stylesheet">
<link href="css/dashboard.css" rel="stylesheet">
<link href="css/responsive.css" rel="stylesheet">
<link href="css/theme.css" rel="stylesheet">
<link href="css/academic.css" rel="stylesheet">
<script src="js/theme.js" defer></script>
</head>
<body>

<div class="app-shell">
  <aside class="sidebar" id="sidebar"></aside>
  <div class="overlay" id="sidebarOverlay"></div>

  <div class="main-area">
    <header class="topbar" id="topbar"></header>

    <main class="content academic-page">
      <div class="page-header">
        <div>
          <h1 id="pageTitle">Attendance</h1>
          <p id="pageIntro">Subject-wise attendance with Present, Absent and Late status.</p>
        </div>
        <div class="page-actions">
          <span class="chip"><i class="bi bi-shield-check text-success"></i>
            Role: <strong data-user-role>—</strong></span>
          <button type="button" class="btn btn-outline-secondary btn-sm" id="refreshAttendance">
            <i class="bi bi-arrow-clockwise me-1"></i>Refresh
          </button>
        </div>
      </div>

      <div id="attendanceAlert" class="alert d-none" role="alert" aria-live="polite"></div>

      <!-- ============================================== STUDENT VIEW -->
      <section id="studentView" class="d-none">
        <div id="attendanceHero" class="mb-4"></div>
        <div id="attendanceStats" class="academic-stat-grid mb-4"></div>
        <div id="studentAttendanceCourses" aria-live="polite"></div>
      </section>

      <!-- ============================================== STAFF VIEW -->
      <section id="staffView" class="d-none">
        <div class="card mb-4">
          <div class="card-body py-3">
            <div class="academic-toolbar mb-0">
              <div>
                <label class="form-label small text-secondary" for="attendanceCourse">Subject</label>
                <select class="form-select form-select-sm" id="attendanceCourse"></select>
              </div>
              <div>
                <label class="form-label small text-secondary" for="attendanceDate">Date</label>
                <input type="date" class="form-control form-control-sm" id="attendanceDate">
              </div>
              <div class="ms-auto align-self-center small text-secondary" id="attendanceFilterSummary">
                Select a subject and date.
              </div>
            </div>
          </div>
        </div>

        <div id="staffAttendanceStats" class="academic-stat-grid mb-4"></div>

        <div class="card">
          <div class="card-header d-flex flex-wrap justify-content-between align-items-center gap-2">
            <div>
              <h6 class="mb-0" id="attendanceSheetTitle">Attendance register</h6>
              <small class="text-secondary" id="attendanceSheetSubtitle">Choose a subject to begin.</small>
            </div>
            <div class="d-flex gap-2">
              <button type="button" class="btn btn-outline-secondary btn-sm" id="markAllPresentBtn" disabled>
                <i class="bi bi-check2-all me-1"></i>Mark all present
              </button>
              <button type="button" class="btn btn-primary btn-sm" id="saveAttendanceBtn" disabled>
                <i class="bi bi-save me-1"></i>Save attendance
              </button>
            </div>
          </div>
          <div id="attendanceSheetMount" aria-live="polite">
            <div class="empty-inline m-3">Select a subject to load the register.</div>
          </div>
        </div>
      </section>
    </main>

    <footer class="app-footer" id="appFooter"></footer>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="js/api.js"></script>
<script src="js/common.js"></script>
<script src="js/auth.js"></script>
<script src="js/shell.js"></script>
<script src="js/academic.js"></script>
<script src="js/attendance.js"></script>
</body>
</html>
