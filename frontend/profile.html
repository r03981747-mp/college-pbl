<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Academic Profile · Smart Campus</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link href="css/style.css" rel="stylesheet">
<link href="css/dashboard.css" rel="stylesheet">
<link href="css/responsive.css" rel="stylesheet">
<link href="css/theme.css" rel="stylesheet">
<link href="css/academic.css" rel="stylesheet">
<script src="js/theme.js" defer></script>
</head>
<body>

<div class="app-shell">
  <aside class="sidebar" id="sidebar"></aside>
  <div class="overlay" id="sidebarOverlay"></div>

  <div class="main-area">
    <header class="topbar" id="topbar"></header>

    <main class="content academic-page">
      <div class="page-header">
        <div>
          <h1 id="pageTitle">Academic Profile</h1>
          <p id="pageIntro">Marks, attendance, assignments, eligibility and mentor information in one view.</p>
        </div>
        <div class="page-actions">
          <span class="chip"><i class="bi bi-shield-check text-success"></i>
            Role: <strong data-user-role>—</strong></span>
          <button type="button" class="btn btn-outline-secondary btn-sm" id="refreshProfile">
            <i class="bi bi-arrow-clockwise me-1"></i>Refresh
          </button>
        </div>
      </div>

      <div id="profileAlert" class="alert d-none" role="alert" aria-live="polite"></div>

      <!-- ============================================== STUDENT VIEW -->
      <section id="studentProfileView" class="d-none">
        <div id="studentProfileMount" aria-live="polite"></div>
      </section>

      <!-- ============================================== STAFF VIEW -->
      <section id="staffProfileView" class="d-none">
        <div class="card mb-4">
          <div class="card-body py-3">
            <div class="academic-toolbar mb-0">
              <div>
                <label class="form-label small text-secondary" for="profileCourseFilter">Subject</label>
                <select class="form-select form-select-sm" id="profileCourseFilter">
                  <option value="">All accessible students</option>
                </select>
              </div>
              <div class="ms-auto small text-secondary align-self-center" id="profileListSummary">
                Loading students…
              </div>
            </div>
          </div>
        </div>

        <div id="studentListMount" aria-live="polite"></div>
        <div id="staffProfileDetail" class="mt-4" aria-live="polite"></div>
      </section>
    </main>

    <footer class="app-footer" id="appFooter"></footer>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="js/api.js"></script>
<script src="js/common.js"></script>
<script src="js/auth.js"></script>
<script src="js/shell.js"></script>
<script src="js/academic.js"></script>
<script src="js/profile.js"></script>
</body>
</html>
